name: 规范变更提案
description: 提议修改 Code2KB 的规范要求、元数据或兼容行为
title: "[规范] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        规范变更会影响其他实现。请说明动机、兼容性和一致性夹具，避免只提交实现代码。
  - type: textarea
    id: problem
    attributes:
      label: 问题与使用场景
      description: 当前规范在哪个真实场景下不足？
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 受影响的规范编号
      description: 列出 C2KB-* 编号；若为新要求，请说明建议归属章节。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的契约
      description: 写明字段、状态、错误条件和实现无关的预期行为。
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: 兼容性判断
      options:
        - 向后兼容
        - 需要提升知识规范版本
        - 尚未确定
    validations:
      required: true
  - type: textarea
    id: fixtures
    attributes:
      label: 一致性夹具计划
      description: 说明需要新增或修改的有效/无效输入及预期结果。
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 我没有把项目专属路径、业务数据、凭据或私有标识写进提案。
          required: true
        - label: 我理解参考实现通过不等于自然语言、线上部署或业务政策已经被证明。
          required: true
